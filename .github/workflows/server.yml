name: TripTeller Docker Deployment

on:
  push:
    branches:
      - prod-docker
  workflow_dispatch:
    inputs:
      api_tag:
        description: 'API image tag (e.g. 1.3.0-a1b2c3d). Leave blank to use latest.'
        required: false
        default: ''

concurrency:
  group: tripteller-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy-docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve API_TAG
        id: tag
        run: |
          INPUT="${{ github.event.inputs.api_tag }}"
          if [ -n "$INPUT" ]; then
            echo "API_TAG=$INPUT" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "API_TAG=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "API_TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Create Production Env File
        run: |
          cat > .production.env << EOF
          KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CALLBACK_URL=${{ secrets.KAKAO_CALLBACK_URL }}
          KAKAO_REDIRECT_URI=${{ secrets.KAKAO_REDIRECT_URI }}
          MONGODB_URL=${{ secrets.MONGODB_URL }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          AWS_S3_ACCESSKEYID=${{ secrets.AWS_S3_ACCESSKEYID }}
          AWS_S3_SECRETACCESSKEY=${{ secrets.AWS_S3_SECRETACCESSKEY }}
          AWS_S3_REGION=${{ secrets.AWS_S3_REGION }}
          AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }}
          AWS_S3_IMG_DIRECTORY=${{ secrets.AWS_S3_IMG_DIRECTORY }}
          NODE_ENV=production
          COOKIE_DOMAIN=${{ secrets.COOKIE_DOMAIN }}
          EOF
      - name: Check deployment files
        run: |
          echo "🔍 Checking deployment files..."
          for f in \
            .production.env \
            docker-compose.yml \
            nginx/default.conf \
            nginx/nginx.conf \
            deploy/prod.dockerfile \
            scripts/deploy.sh
          do
            if [ -f "$f" ]; then
              echo "✅ $f exists"
            else
              echo "❌ $f missing"
            fi
          done
      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_IP }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_SSH_PORT }}
          source: |
            .production.env
            docker-compose.yml
            nginx/default.conf
            nginx/nginx.conf
            deploy/prod.dockerfile
            scripts/deploy.sh
          target: /home/ubuntu/TripTeller_BE/
          debug: true

      - name: Zero-downtime Deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.REMOTE_IP }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_SSH_PORT }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/TripTeller_BE
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh "${{ steps.tag.outputs.API_TAG }}"