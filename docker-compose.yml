services:
  api:
    image: ghcr.io/you/tripteller-api:${API_TAG:-latest}
    pull_policy: always
    env_file:
      - .production.env
    networks:
      - tripteller-network
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/health-check']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      
  nginx:
    image: nginx:stable-alpine
    container_name: tripteller-nginx
    ports:
      - '80:80'
    networks:
      - tripteller-network
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

networks:
  tripteller-network:
    driver: bridge
