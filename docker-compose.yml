services:
  api:
    # 스케일링 위해서는 container_name 불필요
    build:
      context: .
      dockerfile: ./deploy/prod.dockerfile # 프로덕션 빌드로
    image: tripteller-api:${API_TAG:-latest}
    env_file:
      - .production.env
    networks:
      - tripteller-network
    restart: unless-stopped
    init: true
    expose:
      - '3000'
    healthcheck:
      # 이미지에 curl 설치 (Dockerfile에 apk add --no-cache curl)
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./logs/api:/usr/src/app/logs

  nginx:
    image: nginx:stable-alpine
    ports:
      - '80:80'
    networks:
      - tripteller-network
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

networks:
  tripteller-network:
    driver: bridge
