services:
  api:
    image: ghcr.io/you/tripteller-api:${API_TAG:-latest}
    pull_policy: always
    env_file:
      - .production.env
    networks:
      - tripteller-network
    restart: unless-stopped
    init: true                # PID 1 시그널 처리
    expose:
      - "3000"
    healthcheck:
      # 이미지에 curl 설치 (Dockerfile에 apk add --no-cache curl)
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health-check >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:stable-alpine
    container_name: tripteller-nginx
    ports:
      - "80:80"
    networks:
      - tripteller-network
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

networks:
  tripteller-network:
    driver: bridge
